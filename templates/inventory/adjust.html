{% extends "base.html" %}
{% block title %}Adjust Stock{% endblock %}
{% block page_title %}Manual Stock Adjustment{% endblock %}
{% block content %}
<form method="POST" class="form-card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <div class="form-group"><label for="product_id">Product</label>
    <select name="product_id" id="product_id" required>
      <option value="">Select product</option>
      {% for item in products %}<option value="{{ item._id }}" {{ 'selected' if product and product._id == item._id }}>{{ item.name }} ({{ item.sku }})</option>{% endfor %}
    </select>
  </div>
  <div class="form-group"><label for="quantity_change">Quantity change</label><input id="quantity_change" name="quantity_change" type="number" required placeholder="Use a negative value to remove stock"/></div>
  <div class="form-group"><label for="reason">Reason</label><input id="reason" name="reason" required maxlength="200"/></div>
  <div class="form-actions"><button class="btn btn-primary" type="submit">Save adjustment</button><a class="btn btn-outline" href="{{ url_for('inventory.index') }}">Cancel</a></div>
</form>
{% endblock %}
