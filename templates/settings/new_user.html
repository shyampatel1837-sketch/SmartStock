{% extends "base.html" %}
{% block title %}Add User{% endblock %}
{% block page_title %}Create Staff Account{% endblock %}
{% block content %}
<form method="POST" class="form-card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <div class="form-grid two-col">
    <div class="form-group"><label for="username">Username</label><input id="username" name="username" required minlength="3" maxlength="50"/></div>
    <div class="form-group"><label for="full_name">Full name</label><input id="full_name" name="full_name"/></div>
    <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email"/></div>
    <div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" maxlength="72"/></div>
    <div class="form-group"><label for="role">Role</label><select id="role" name="role">{% for role in roles %}<option value="{{ role }}">{{ role|title }}</option>{% endfor %}</select></div>
  </div>
  <div class="form-actions"><button class="btn btn-primary" type="submit">Create account</button><a class="btn btn-outline" href="{{ url_for('settings.users') }}">Cancel</a></div>
</form>
{% endblock %}
